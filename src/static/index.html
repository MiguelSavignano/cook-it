<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cook-It</title>
<style>
  :root {
    --cream: #FFF6EC;
    --cream-2: #FDEBD3;
    --orange: #E8703A;
    --orange-dark: #C9541F;
    --orange-light: #FFB37B;
    --brown: #4A2E1E;
    --brown-soft: #8A6A55;
    --green-ok: #6B8E4E;
    --shadow: 0 10px 30px rgba(74, 46, 30, 0.15);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, var(--cream) 0%, var(--cream-2) 100%);
    color: var(--brown);
  }
  body {
    display: flex; flex-direction: column; align-items: center;
    min-height: 100%;
    padding: 24px 16px 48px;
  }
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  header h1 {
    font-size: 2.2rem;
    margin: 0;
    color: var(--orange-dark);
    letter-spacing: -0.5px;
  }
  header p {
    margin: 4px 0 0;
    color: var(--brown-soft);
    font-size: 0.95rem;
  }

  .stage {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    margin-top: 18px;
  }

  /* --- Microphone button --- */
  .mic-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  #micBtn {
    width: 120px; height: 120px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, var(--orange-light), var(--orange));
    box-shadow: var(--shadow);
    font-size: 3rem;
    cursor: pointer;
    color: white;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  #micBtn:active { transform: scale(0.96); }
  #micBtn.listening {
    background: linear-gradient(145deg, #ff7a5c, #d8391f);
    animation: pulse 1.1s infinite;
  }
  #micBtn.thinking {
    background: linear-gradient(145deg, #e0a95c, #b97a1f);
    animation: spin-glow 1.4s infinite;
  }
  #micBtn:disabled { cursor: default; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(216, 57, 31, 0.45), var(--shadow); }
    70% { box-shadow: 0 0 0 22px rgba(216, 57, 31, 0), var(--shadow); }
    100% { box-shadow: 0 0 0 0 rgba(216, 57, 31, 0), var(--shadow); }
  }
  @keyframes spin-glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.25); }
  }

  /* --- "Creating your recipe" loader: plain CSS, no external GIF/asset,
     shown while gemma3 generates a brand-new (non-local) recipe --- */
  .cooking-loader {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    vertical-align: middle;
  }
  .cooking-loader .pot {
    font-size: 1.3rem;
    display: inline-block;
    animation: pot-wiggle 1.1s ease-in-out infinite;
  }
  .cooking-loader .steam {
    display: inline-flex;
    gap: 3px;
  }
  .cooking-loader .steam span {
    display: inline-block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--orange-light);
    animation: steam-rise 1.3s ease-in-out infinite;
  }
  .cooking-loader .steam span:nth-child(2) { animation-delay: 0.2s; }
  .cooking-loader .steam span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pot-wiggle {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }
  @keyframes steam-rise {
    0% { transform: translateY(0); opacity: 0; }
    30% { opacity: 1; }
    100% { transform: translateY(-12px); opacity: 0; }
  }

  #statusText {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--orange-dark);
    min-height: 1.4em;
  }
  #userText {
    font-size: 0.88rem;
    color: var(--brown-soft);
    font-style: italic;
    text-align: center;
    min-height: 1.2em;
  }

  /* --- Recipe card --- */
  .card {
    width: 100%;
    background: white;
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 22px 24px;
    border: 1px solid rgba(232, 112, 58, 0.15);
  }
  .card.placeholder {
    text-align: center;
    color: var(--brown-soft);
  }
  .placeholder-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--brown);
  }
  .card.placeholder .examples {
    margin-top: 12px;
    display: flex; flex-direction: column; gap: 6px;
    font-size: 0.9rem;
  }
  .card.placeholder .examples span {
    background: var(--cream-2);
    border-radius: 10px;
    padding: 6px 10px;
  }

  /* --- Tap-to-pick recipe list (home screen, no recipe active) --- */
  .recipe-list {
    margin-top: 14px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
  }
  .loading-hint {
    grid-column: 1 / -1;
    color: var(--brown-soft);
    font-size: 0.85rem;
    padding: 8px 0;
  }
  .recipe-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
    text-align: left;
    background: var(--cream-2);
    border: 1px solid rgba(232, 112, 58, 0.18);
    border-radius: 14px;
    padding: 12px 14px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .recipe-card:hover { background: var(--cream); }
  .recipe-card:active { transform: scale(0.97); }
  .recipe-card-name {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--brown);
    text-transform: capitalize;
  }
  .recipe-card-servings {
    font-size: 0.75rem;
    color: var(--brown-soft);
  }

  .recipe-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--brown);
    margin: 0 0 4px;
    text-transform: capitalize;
  }
  .source-badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .source-badge.local { background: #E4EFD8; color: var(--green-ok); }
  .source-badge.general { background: var(--cream-2); color: var(--brown-soft); }

  .summary {
    font-size: 0.92rem;
    color: var(--brown-soft);
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .ingredients {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 16px;
  }
  .ingredients .chip {
    background: var(--cream-2);
    color: var(--brown);
    font-size: 0.8rem;
    padding: 5px 10px;
    border-radius: 999px;
  }

  .progress {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .progress .dots { display: flex; gap: 5px; }
  .progress .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--cream-2);
  }
  .progress .dot.done { background: var(--orange); }
  .progress .dot.current { background: var(--orange-dark); box-shadow: 0 0 0 3px rgba(232,112,58,0.25); }
  .progress .label { font-size: 0.8rem; color: var(--brown-soft); font-weight: 600; }

  .current-step {
    background: linear-gradient(135deg, var(--cream-2), var(--cream));
    border-radius: 16px;
    padding: 18px 20px;
    font-size: 1.25rem;
    line-height: 1.45;
    font-weight: 600;
    color: var(--brown);
    border-left: 6px solid var(--orange);
  }

  /* --- Step timer: functional placeholder styling only, restyle freely --- */
  .step-timer:empty { display: none; }
  .step-timer {
    margin-top: 10px;
  }
  .timer-start {
    width: 100%;
    padding: 12px 10px;
    border: 1px dashed var(--orange-light);
    border-radius: 14px;
    background: var(--cream-2);
    color: var(--orange-dark);
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
  }
  .timer-start:hover { background: var(--cream); }
  .timer-running {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 10px;
    border-radius: 14px;
    background: var(--cream-2);
  }
  .timer-countdown {
    font-size: 1.4rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--orange-dark);
  }
  .timer-cancel {
    border: none;
    background: none;
    color: var(--brown-soft);
    font-size: 1rem;
    cursor: pointer;
    padding: 4px 8px;
  }
  .timer-finished {
    text-align: center;
    padding: 12px 10px;
    border-radius: 14px;
    background: #E4EFD8;
    color: var(--green-ok);
    font-weight: 700;
  }

  .tip-box {
    margin-top: 14px;
    background: #FFF3E0;
    border-left: 6px solid var(--orange-light);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 0.85rem;
    color: var(--brown-soft);
  }
  .tip-box b { color: var(--orange-dark); }

  .finished {
    text-align: center;
    padding: 10px 0;
  }
  .finished .emoji { font-size: 2.6rem; }

  .secondary-actions {
    display: flex; gap: 10px; margin-top: 4px;
  }
  .secondary-actions button {
    background: none;
    border: 1px solid var(--orange-light);
    color: var(--orange-dark);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .secondary-actions button:hover { background: var(--cream-2); }

  footer {
    margin-top: 28px;
    font-size: 0.75rem;
    color: var(--brown-soft);
    text-align: center;
    opacity: 0.7;
  }

  /* --- Answer to a follow-up question (doesn't touch the current step) --- */
  .question-answer {
    background: #FFF3E0;
    border-left: 6px solid var(--orange);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.9rem;
    color: var(--brown);
    margin-top: 4px;
  }

  /* --- Fixed step-navigation bar (buttons, no voice needed) --- */
  .step-nav {
    position: sticky;
    bottom: 14px;
    display: flex;
    gap: 12px;
    width: 100%;
    margin-top: 8px;
  }
  .step-nav button {
    flex: 1;
    padding: 16px 10px;
    border: none;
    border-radius: 16px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow);
    color: white;
    background: linear-gradient(145deg, var(--orange-light), var(--orange));
  }
  .step-nav button.previous {
    background: linear-gradient(145deg, #f0d8b8, #d8b98a);
    color: var(--brown);
  }
  .step-nav button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .step-nav button:active:not(:disabled) { transform: scale(0.97); }
</style>
</head>
<body>

<header>
  <h1>🍳 Cook-It</h1>
  <p>Tu ayudante de cocina, 100% local y por voz</p>
</header>

<div class="stage">

  <div class="mic-wrap">
    <button id="micBtn" title="Toca y habla">🎤</button>
    <div id="statusText">Toca el micrófono y pide una receta</div>
    <div id="userText"></div>
  </div>

  <div id="card" class="card placeholder">
    <div class="placeholder-title">👨‍🍳 ¿Qué cocinamos hoy?</div>
    <div class="examples">
      <span>"Dame la receta de tortilla de patatas"</span>
      <span>"Cómo se hacen macarrones con tomate"</span>
    </div>
  </div>

</div>

<footer>Todo corre en tu ordenador: whisper (STT) · gemma3 vía Ollama (LLM) · Piper (TTS)</footer>

<!-- Relative path (no leading slash): works both mounted at the domain root
     (dev, :3000) and reverse-proxied under a subpath, e.g. Caddy /cookit/*. -->
<script src="static/timer.js"></script>
<script src="static/app.js"></script>

</body>
</html>
