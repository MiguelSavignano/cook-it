<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cook-It · Cocinando</title>
<style>
  :root {
    --orange: #E8703A;
    --orange-light: #FFB37B;
    /* "Bimo Chef" robot palette. The whole viewport IS the device's OLED
       panel (see docs/hardware.md -- a 2.42" SSD1309 sits behind the face
       window on the real enclosure) -- so the page background itself is
       the black "screen", with glowing blue eyes/mouth as the only face
       chrome. The cream/white body + chef hat from the reference art are
       the physical printed case, not something the display renders. */
    --screen: #0B0C0E;
    --screen-blue: #55D8F2;
    --screen-glow: rgba(85, 216, 242, 0.55);
    --ink: #F3ECDF;
    --ink-soft: rgba(243, 236, 223, 0.6);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--screen);
    color: var(--ink);
    overflow: hidden; /* this is a fixed "device screen", not a scrolling page */
    overscroll-behavior: none;
  }

  /* --- Layout: nav buttons pinned to the left/right edges (thumb reach when
     the phone is held/propped up in landscape), everything else centered
     between them. See the orientation:landscape media query below for the
     sizing this is tuned for. --- */
  .cook-stage {
    height: 100dvh;
    height: 100vh; /* fallback for browsers without dvh */
    width: 100%;
    display: grid;
    grid-template-columns: minmax(56px, 84px) 1fr minmax(56px, 84px);
    user-select: none;
    -webkit-user-select: none;
  }

  .side-nav {
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: var(--ink);
    font-weight: 700;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .side-nav .arrow { font-size: clamp(1.6rem, 6vh, 2.6rem); line-height: 1; }
  .side-nav .side-label {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .side-nav.prev {
    background: rgba(255, 255, 255, 0.06);
    color: var(--ink-soft);
    border-radius: 0 18px 18px 0;
    padding-left: max(4px, env(safe-area-inset-left));
  }
  .side-nav.next {
    background: linear-gradient(145deg, var(--orange-light), var(--orange));
    color: #2a1608;
    border-radius: 18px 0 0 18px;
    padding-right: max(4px, env(safe-area-inset-right));
  }
  .side-nav:disabled { opacity: 0.3; cursor: default; }
  .side-nav:active:not(:disabled) { transform: scale(0.97); }
  .side-nav[hidden] { visibility: hidden; }

  .cook-center {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    overflow: hidden;
  }

  .cook-topbar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }
  .back-btn {
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--screen-blue);
    cursor: pointer;
    padding: 2px 6px;
    flex: 0 0 auto;
    touch-action: manipulation;
  }
  .cook-title {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
    color: var(--ink);
    text-transform: capitalize;
    font-size: clamp(0.85rem, 2.6vh, 1.05rem);
  }
  .cook-progress {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  .dots { display: flex; gap: 3px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); }
  .dot.done { background: var(--orange); }
  .dot.current { background: var(--screen-blue); box-shadow: 0 0 0 2px var(--screen-glow); }
  .progress-label { font-size: 0.64rem; color: var(--ink-soft); font-weight: 600; white-space: nowrap; }

  /* --- The face: idle "thinking" look with wandering eyes/blinks (JS-driven),
     plus listening/thinking/speaking/happy/confused expressions swapped by
     class. Tapping it starts/stops the same voice-question flow the old mic
     button drove -- see cook.js.

     Unlike a normal on-page widget, this face IS the screen: the real
     enclosure (docs/hardware.md) puts a small OLED behind a face window in
     a 3D-printed cream/white "Gorro" body wearing a chef hat -- but that
     body and hat are printed plastic, not pixels. What the panel itself
     shows is just this: black background, glowing blue eyes and mouth,
     filling the whole display. So here .face-wrap fills essentially the
     entire viewport (topbar/step strip float thinly at the edges), and
     the eyes/mouth are sized directly off viewport units instead of a
     small fixed-size avatar box. --- */
  .face-wrap {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5vh;
    cursor: pointer;
    touch-action: manipulation;
    position: relative;
  }
  .face-hint {
    font-size: 0.72rem;
    color: var(--ink-soft);
    text-align: center;
    min-height: 1.1em;
  }

  .face {
    position: relative;
    width: 100%;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(6px, 2.5vh, 20px);
  }

  /* Listening: the whole screen breathes with a soft blue glow instead of
     a ring around an avatar -- there's no avatar edge to ring anymore. */
  .face .ring {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle, var(--screen-glow) 0%, transparent 65%);
    opacity: 0;
  }
  .face.state-listening .ring {
    opacity: 0.35;
    animation: pulse-glow 1.1s infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.45; }
  }

  /* No eyebrows -- thinking/confused/listening are read off the eyes
     (darting pupils, JS-driven) and the mouth alone.

     Sized off vh, not vw: this route is meant for a wide-but-short
     landscape phone screen (browser chrome eats into the height), and on
     a viewport like that vw stays generous while vh is the scarce
     dimension. Driving the eyes/mouth from vw let them balloon to a size
     that pushed the mouth completely out of the (height-limited)
     face-wrap. Setting the *height* directly from vh and letting the
     width follow via aspect-ratio keeps the whole face inside whatever
     vertical room is actually left after the topbar/step strip. */
  .eyes { display: flex; align-items: center; gap: clamp(16px, 8vh, 90px); }
  .eye {
    position: relative;
    height: clamp(44px, 22vh, 170px);
    aspect-ratio: 4 / 9;
    background: transparent;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: transform 0.15s ease;
  }
  .face.blink .eye { transform: scaleY(0.12); }
  .face.state-listening .eye { transform: scale(1.1); }
  .pupil {
    width: 78%;
    height: 78%;
    border-radius: 50%;
    background: var(--screen-blue);
    box-shadow: 0 0 clamp(6px, 2.5vh, 18px) var(--screen-glow);
    transition: transform 0.35s ease;
  }
  /* Happy: eyes become closed "^ ^" curves instead of open ovals. */
  .face.state-happy .eye {
    background: transparent;
    height: 34%;
    border-radius: 0 0 60px 60px;
    border-bottom: clamp(4px, 0.8vh, 8px) solid var(--screen-blue);
    box-shadow: 0 4px 10px var(--screen-glow);
  }
  .face.state-happy .pupil { display: none; }

  .cheeks {
    position: absolute;
    bottom: 22%;
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    gap: clamp(60px, 26vh, 260px);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .cheek { width: clamp(14px, 6vh, 40px); aspect-ratio: 1 / 1; border-radius: 50%; background: rgba(232, 112, 58, 0.5); filter: blur(2px); }
  .face.state-happy .cheeks { opacity: 1; }

  /* Default/idle mouth is already a warm smile, not a neutral line -- the
     resting face should read as content, not blank. Tall enough relative
     to its width that the curve actually reads as a grin. state-happy
     widens it further for the "recipe finished" celebration. Same
     vh-first sizing logic as the eyes above. */
  .mouth {
    width: clamp(48px, 21vh, 160px);
    height: clamp(16px, 7vh, 46px);
    background: var(--screen-blue);
    box-shadow: 0 0 clamp(5px, 2vh, 16px) var(--screen-glow);
    border-radius: 0 0 50% 50%;
    transform-origin: center top;
    transition: all 0.2s ease;
  }
  .face.state-happy .mouth { width: clamp(64px, 28vh, 210px); height: clamp(22px, 9vh, 60px); border-radius: 0 0 42% 42%; }
  .face.state-confused .mouth { transform: rotate(9deg); }
  .face.state-speaking .mouth { animation: talk 0.32s ease-in-out infinite; }
  @keyframes talk {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.7); }
  }

  /* Step timer: takes over the exact spot the face occupies (same
     face-wrap slot) whenever the current step needs one and there's no
     voice interaction in progress -- see cook.js's updateFaceTimerVisibility().
     .face/.timer-view [hidden] need an explicit override because both
     already declare their own `display`, which would otherwise beat the
     UA's `[hidden] { display: none }`. */
  .face[hidden], .timer-view[hidden] { display: none; }
  .timer-view {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vh, 26px);
  }
  .timer-display {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: clamp(48px, 22vh, 180px);
    color: var(--screen-blue);
    text-shadow: 0 0 clamp(10px, 4vh, 40px) var(--screen-glow);
    line-height: 1;
  }
  .timer-message {
    font-size: clamp(0.9rem, 2.6vh, 1.3rem);
    color: var(--ink);
    text-align: center;
    font-weight: 700;
    padding: 0 16px;
  }
  .timer-btn {
    border: none;
    border-radius: 999px;
    padding: clamp(10px, 2.2vh, 16px) clamp(20px, 4vw, 34px);
    font-size: clamp(0.85rem, 2.2vh, 1.05rem);
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
    max-width: min(92%, 480px);
    white-space: normal;
    text-align: center;
  }
  .timer-start-btn {
    background: linear-gradient(145deg, var(--orange-light), var(--orange));
    color: #2a1608;
  }
  .timer-cancel-btn {
    background: rgba(255, 255, 255, 0.08);
    color: var(--ink-soft);
    border: 1px solid rgba(255, 255, 255, 0.18);
  }

  /* Pinned thin strip under the face -- the face keeps most of the
     screen, this is a caption/status strip, not a competing panel. */
  .step-area {
    width: 100%;
    flex: 0 0 auto;
    max-height: 34vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .user-text, .answer-box {
    font-size: 0.75rem;
    text-align: center;
    width: 100%;
  }
  .user-text { color: var(--ink-soft); font-style: italic; min-height: 1.1em; }
  .answer-box {
    background: rgba(255, 255, 255, 0.06);
    border-left: 3px solid var(--screen-blue);
    border-radius: 10px;
    padding: 8px 12px;
    color: var(--ink);
  }
  .current-step {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 14px;
    padding: 8px 14px;
    font-size: clamp(0.8rem, 2.2vh, 1rem);
    line-height: 1.3;
    font-weight: 600;
    color: var(--ink);
    border-left: 3px solid var(--orange);
    text-align: center;
  }
  .finished-msg { font-size: 1.1rem; font-weight: 700; }
  .tip-box {
    width: 100%;
    background: rgba(255, 255, 255, 0.05);
    border-left: 3px solid var(--orange-light);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 0.7rem;
    color: var(--ink-soft);
  }
  .tip-box b { color: var(--orange-light); }
  .home-btn {
    background: none;
    border: 1px solid var(--screen-blue);
    color: var(--screen-blue);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.8rem;
    cursor: pointer;
  }

  /* Extra-short landscape viewports (phone lying flat, browser chrome
     eating into the height): the eyes/mouth already shrink on their own
     (sized off vh above) -- this just reclaims a bit more room for the
     step strip and tightens its own padding. */
  @media (orientation: landscape) and (max-height: 380px) {
    .step-area { max-height: 42vh; }
    .cook-center { gap: 2px; padding-top: 4px; }
    .current-step { font-size: 0.82rem; padding: 6px 10px; }
  }
</style>
</head>
<body>

<div class="cook-stage" id="cookStage">

  <button class="side-nav prev" id="prevBtn" title="Paso anterior" aria-label="Paso anterior">
    <span class="arrow">‹</span><span class="side-label">Anterior</span>
  </button>

  <div class="cook-center">
    <div class="cook-topbar">
      <button class="back-btn" id="backBtn" title="Empezar otra receta" aria-label="Empezar otra receta">⟵</button>
      <div class="cook-title" id="recipeTitle">Cargando…</div>
      <div class="cook-progress">
        <div class="dots" id="dots"></div>
        <div class="progress-label" id="progressLabel"></div>
      </div>
    </div>

    <div class="face-wrap" id="faceWrap" title="Toca la cara para preguntar">
      <div class="face state-idle" id="face">
        <div class="ring"></div>
        <div class="eyes">
          <div class="eye left"><div class="pupil" id="pupilLeft"></div></div>
          <div class="eye right"><div class="pupil" id="pupilRight"></div></div>
        </div>
        <div class="mouth" id="mouth"></div>
        <div class="cheeks"><span class="cheek left"></span><span class="cheek right"></span></div>
      </div>
      <div class="face-hint" id="faceHint">Toca la cara para preguntar</div>

      <!-- Same slot as .face -- shown instead of it while the current step
           has a timer and nothing voice-related is happening (see
           updateFaceTimerVisibility() in cook.js). -->
      <div class="timer-view" id="timerView" hidden>
        <div class="timer-display" id="timerDisplay">0:00</div>
        <div class="timer-message" id="timerMessage" hidden></div>
        <button class="timer-btn timer-start-btn" id="timerStartBtn">▶ Iniciar temporizador</button>
        <button class="timer-btn timer-cancel-btn" id="timerCancelBtn" hidden>✕ Cancelar</button>
      </div>
    </div>

    <div class="step-area">
      <div class="user-text" id="userText"></div>
      <div class="answer-box" id="answerBox" hidden></div>
      <div class="current-step" id="currentStep">Cargando…</div>
      <div class="tip-box" id="tipBox" hidden></div>
      <button class="home-btn" id="homeBtn" hidden>🏠 Volver a recetas</button>
    </div>
  </div>

  <button class="side-nav next" id="nextBtn" title="Paso siguiente" aria-label="Paso siguiente">
    <span class="arrow">›</span><span class="side-label">Siguiente</span>
  </button>

</div>

<!-- Relative path (no leading slash): works both mounted at the domain root
     (dev, :3000) and reverse-proxied under a subpath, e.g. Caddy /cookit/*. -->
<script src="static/timer.js"></script>
<script src="static/cook.js"></script>

</body>
</html>
