<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cook-It · Cocinando</title>
<style>
  :root {
    --cream: #FFF6EC;
    --cream-2: #FDEBD3;
    --orange: #E8703A;
    --orange-dark: #C9541F;
    --orange-light: #FFB37B;
    --brown: #4A2E1E;
    --brown-soft: #8A6A55;
    --shadow: 0 10px 30px rgba(74, 46, 30, 0.15);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at top, var(--cream) 0%, var(--cream-2) 100%);
    color: var(--brown);
    overflow: hidden; /* this is a fixed "device screen", not a scrolling page */
    overscroll-behavior: none;
  }

  /* --- Layout: nav buttons pinned to the left/right edges (thumb reach when
     the phone is held/propped up in landscape), everything else centered
     between them. See the orientation:landscape media query below for the
     sizing this is tuned for. --- */
  .cook-stage {
    height: 100dvh;
    height: 100vh; /* fallback for browsers without dvh */
    width: 100%;
    display: grid;
    grid-template-columns: minmax(56px, 84px) 1fr minmax(56px, 84px);
    user-select: none;
    -webkit-user-select: none;
  }

  .side-nav {
    border: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    color: white;
    font-weight: 700;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .side-nav .arrow { font-size: clamp(1.6rem, 6vh, 2.6rem); line-height: 1; }
  .side-nav .side-label {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .side-nav.prev {
    background: linear-gradient(145deg, #f0d8b8, #d8b98a);
    color: var(--brown);
    border-radius: 0 18px 18px 0;
    padding-left: max(4px, env(safe-area-inset-left));
  }
  .side-nav.next {
    background: linear-gradient(145deg, var(--orange-light), var(--orange));
    border-radius: 18px 0 0 18px;
    padding-right: max(4px, env(safe-area-inset-right));
  }
  .side-nav:disabled { opacity: 0.35; cursor: default; }
  .side-nav:active:not(:disabled) { transform: scale(0.97); }
  .side-nav[hidden] { visibility: hidden; }

  .cook-center {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    overflow: hidden;
  }

  .cook-topbar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
  }
  .back-btn {
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--orange-dark);
    cursor: pointer;
    padding: 2px 6px;
    flex: 0 0 auto;
    touch-action: manipulation;
  }
  .cook-title {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
    color: var(--brown);
    text-transform: capitalize;
    font-size: clamp(0.85rem, 2.6vh, 1.05rem);
  }
  .cook-progress {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
  }
  .dots { display: flex; gap: 3px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cream-2); }
  .dot.done { background: var(--orange); }
  .dot.current { background: var(--orange-dark); box-shadow: 0 0 0 2px rgba(232, 112, 58, 0.25); }
  .progress-label { font-size: 0.64rem; color: var(--brown-soft); font-weight: 600; white-space: nowrap; }

  /* --- The face: idle "thinking" look with wandering eyes/blinks (JS-driven),
     plus listening/thinking/speaking/happy/confused expressions swapped by
     class. Tapping it starts/stops the same voice-question flow the old mic
     button drove -- see cook.js. --- */
  .face-wrap {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .face-hint {
    font-size: 0.72rem;
    color: var(--brown-soft);
    text-align: center;
    min-height: 1.1em;
  }

  .face {
    position: relative;
    width: clamp(84px, 34vh, 190px);
    height: clamp(84px, 34vh, 190px);
  }
  .face .ring {
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 3px solid var(--orange);
    opacity: 0;
  }
  .face.state-listening .ring {
    opacity: 0.7;
    animation: pulse-ring 1.1s infinite;
  }
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(232, 112, 58, 0.45); }
    70% { box-shadow: 0 0 0 16px rgba(232, 112, 58, 0); }
    100% { box-shadow: 0 0 0 0 rgba(232, 112, 58, 0); }
  }

  .head {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--orange-light), var(--orange));
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7%;
    animation: head-sway 6s ease-in-out infinite;
  }
  .face.state-listening .head,
  .face.state-thinking .head { animation-play-state: paused; }
  @keyframes head-sway {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }

  .brows { display: flex; gap: 16%; width: 56%; justify-content: space-between; }
  .brow {
    width: 26%;
    height: 4px;
    background: var(--brown);
    border-radius: 4px;
    transition: transform 0.3s ease;
  }
  .face.state-thinking .brow.left { transform: translateY(-3px) rotate(-12deg); }
  .face.state-thinking .brow.right { transform: translateY(1px) rotate(5deg); }
  .face.state-listening .brow { transform: translateY(-2px); }
  .face.state-confused .brow.left { transform: rotate(12deg); }
  .face.state-confused .brow.right { transform: rotate(-12deg); }

  .eyes { display: flex; gap: 12%; width: 62%; justify-content: space-between; }
  .eye {
    position: relative;
    width: 32%;
    aspect-ratio: 1 / 1;
    background: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: transform 0.15s ease;
  }
  .face.blink .eye { transform: scaleY(0.12); }
  .face.state-listening .eye { transform: scale(1.12); }
  .pupil {
    width: 42%;
    height: 42%;
    border-radius: 50%;
    background: var(--brown);
    transition: transform 0.35s ease;
  }
  /* Happy: eyes become closed "^ ^" curves instead of open circles. */
  .face.state-happy .eye {
    background: transparent;
    height: 34%;
    border-radius: 0 0 60px 60px;
    border-bottom: 4px solid var(--brown);
  }
  .face.state-happy .pupil { display: none; }

  .cheeks {
    position: absolute;
    bottom: 20%;
    left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 6%;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .cheek { width: 14%; aspect-ratio: 1 / 1; border-radius: 50%; background: rgba(255, 255, 255, 0.55); }
  .face.state-happy .cheeks { opacity: 1; }

  .mouth {
    width: 24%;
    height: 4px;
    background: var(--brown);
    border-radius: 4px;
    transition: all 0.2s ease;
  }
  .face.state-happy .mouth { width: 40%; height: 16px; border-radius: 0 0 20px 20px; }
  .face.state-confused .mouth { transform: rotate(9deg); }
  .face.state-speaking .mouth { animation: talk 0.32s ease-in-out infinite; }
  @keyframes talk {
    0%, 100% { height: 4px; width: 24%; border-radius: 4px; }
    50% { height: 13px; width: 18%; border-radius: 0 0 10px 10px; }
  }

  .step-area {
    width: 100%;
    flex: 0 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .user-text, .answer-box {
    font-size: 0.75rem;
    text-align: center;
    width: 100%;
  }
  .user-text { color: var(--brown-soft); font-style: italic; min-height: 1.1em; }
  .answer-box {
    background: #FFF3E0;
    border-left: 5px solid var(--orange);
    border-radius: 10px;
    padding: 8px 12px;
    color: var(--brown);
  }
  .current-step {
    width: 100%;
    background: linear-gradient(135deg, var(--cream-2), var(--cream));
    border-radius: 14px;
    padding: 10px 14px;
    font-size: clamp(0.85rem, 2.6vh, 1.1rem);
    line-height: 1.35;
    font-weight: 600;
    color: var(--brown);
    border-left: 5px solid var(--orange);
    text-align: center;
  }
  .finished-msg { font-size: 1.1rem; font-weight: 700; }
  .tip-box {
    width: 100%;
    background: #FFF3E0;
    border-left: 5px solid var(--orange-light);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 0.72rem;
    color: var(--brown-soft);
  }
  .tip-box b { color: var(--orange-dark); }
  .home-btn {
    background: none;
    border: 1px solid var(--orange-light);
    color: var(--orange-dark);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.8rem;
    cursor: pointer;
  }

  /* Extra-short landscape viewports (phone lying flat, browser chrome
     eating into the height): shrink the face a bit further than the vh
     clamp alone would, so the step text never gets squeezed out. */
  @media (orientation: landscape) and (max-height: 380px) {
    .face { width: clamp(64px, 26vh, 130px); height: clamp(64px, 26vh, 130px); }
    .cook-center { gap: 2px; padding-top: 4px; }
    .current-step { font-size: 0.82rem; padding: 6px 10px; }
  }
</style>
</head>
<body>

<div class="cook-stage" id="cookStage">

  <button class="side-nav prev" id="prevBtn" title="Paso anterior" aria-label="Paso anterior">
    <span class="arrow">‹</span><span class="side-label">Anterior</span>
  </button>

  <div class="cook-center">
    <div class="cook-topbar">
      <button class="back-btn" id="backBtn" title="Empezar otra receta" aria-label="Empezar otra receta">⟵</button>
      <div class="cook-title" id="recipeTitle">Cargando…</div>
      <div class="cook-progress">
        <div class="dots" id="dots"></div>
        <div class="progress-label" id="progressLabel"></div>
      </div>
    </div>

    <div class="face-wrap" id="faceWrap" title="Toca la cara para preguntar">
      <div class="face state-idle" id="face">
        <div class="ring"></div>
        <div class="head">
          <div class="brows">
            <div class="brow left"></div>
            <div class="brow right"></div>
          </div>
          <div class="eyes">
            <div class="eye left"><div class="pupil" id="pupilLeft"></div></div>
            <div class="eye right"><div class="pupil" id="pupilRight"></div></div>
          </div>
          <div class="mouth" id="mouth"></div>
          <div class="cheeks"><span class="cheek left"></span><span class="cheek right"></span></div>
        </div>
      </div>
      <div class="face-hint" id="faceHint">Toca la cara para preguntar</div>
    </div>

    <div class="step-area">
      <div class="user-text" id="userText"></div>
      <div class="answer-box" id="answerBox" hidden></div>
      <div class="current-step" id="currentStep">Cargando…</div>
      <div class="tip-box" id="tipBox" hidden></div>
      <button class="home-btn" id="homeBtn" hidden>🏠 Volver a recetas</button>
    </div>
  </div>

  <button class="side-nav next" id="nextBtn" title="Paso siguiente" aria-label="Paso siguiente">
    <span class="arrow">›</span><span class="side-label">Siguiente</span>
  </button>

</div>

<!-- Relative path (no leading slash): works both mounted at the domain root
     (dev, :3000) and reverse-proxied under a subpath, e.g. Caddy /cookit/*. -->
<script src="static/cook.js"></script>

</body>
</html>
